name: Android CI

on:
  push:
    branches: [ "mainv4" ]
  pull_request:
    branches: [ "mainv4" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Clone uCore
      run: ./gradlew setupUCore
    - name: Build with Gradle
      run: ./gradlew :android:assembleGoogleDebug
    - name: Upload built apk file
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}
        path: android/build/outputs/apk/google/debug/*.apk
